services:

  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: glms-sql-server
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password@12345"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Password@12345 -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10


  glms-backend-api:
    build:
      context: ./GLMS.API
      dockerfile: Dockerfile
    container_name: glms-api
    ports:
      - "7250:8080"
    depends_on:
      sql-server-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sql-server-db;Database=GLMSDb;User Id=sa;Password=Password@12345;TrustServerCertificate=True;"


  glms-frontend-web:
    build:
      context: ./GLMS.Web
      dockerfile: Dockerfile
    container_name: glms-web
    ports:
      - "5000:8080"
    depends_on:
      - glms-backend-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiSettings__BaseUrl: "http://glms-backend-api:8080/"


volumes:
  sqldata: